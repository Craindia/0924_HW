<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript 入門 - 課程卡片</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="card">
    <!-- 頂部課程圖片 -->
    <div class="card-header">
      <img src="banner.webp" alt="JavaScript 入門" class="card-img">
    </div>

    <!-- 卡片內容區塊 -->
    <div class="card-body">
      <!-- 課程價格 -->
      <div class="price">NT$3,800</div>

      <!-- 加入購物車按鈕 -->
      <button type="button" class="btn btn-primary">加入購物車</button>

      <!-- 直接購買按鈕 -->
      <button type="button" class="btn btn-secondary">直接購買</button>

      <!-- 課程包含內容 -->
      <div class="features">
        <h3 class="features-title">此課程包含</h3>
        <ul class="features-list">
          <li>終身存取權</li>
          <li>行動裝置隨時學習</li>
          <li>9.9 小時課程內容</li>
          <li>完課證書</li>
        </ul>
      </div>
    </div>

    <!-- 底部企業方案區塊 -->
    <div class="card-footer">
      公司同事一起學更划算！ <a href="#" class="footer-link">歡迎洽詢企業方案</a>
    </div>
  </div>
</body>

</html>
